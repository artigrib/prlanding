<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Katalog sad — printedrobotics.cz</title>
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://printedrobotics.cz/#katalog">
<script>
// Old address. sada.html?r=<id> → /sada/<id>/ (rest of the query kept), anything else → the catalogue on the homepage.
(function () {
  var m = /[?&]r=([a-z0-9-]{1,40})(?:&|$)/i.exec(location.search);
  var rest = location.search.replace(/[?&]r=[^&]*/, '').replace(/^&/, '?');
  location.replace(m ? 'sada/' + m[1].toLowerCase() + '/' + rest + location.hash : './' + rest + '#katalog');
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=./#katalog"></noscript>

</body>
