name: sil-policy-trial

# Opt-in, not on every push: a real pretrained ACT policy from the Hugging Face Hub drives the virtual
# SO-101 for 20 s on CPU, through unmodified LeRobot 0.6.1 and the runner's virtual cameras.
# Downloads PyTorch (CPU), LeRobot and the model (about 210 MB). Run it by hand (Actions -> Run workflow)
# or put the label "policy-trial" on a pull request. Public model, no token.
on:
  workflow_dispatch:
    inputs:
      policy:
        description: Hub repo id of a LeRobot policy trained for the SO-101 follower
        default: samarth-shukla6/act-svla-so101-pickplace
      cameras:
        description: Camera names the policy expects (NAME or NAME=VIEW; views up, side, front, wrist)
        default: up,side
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  trial:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'policy-trial'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PyTorch (CPU) + LeRobot 0.6.1 + pyzmq
        run: |
          python -m pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q "lerobot[feetech,dataset]==0.6.1" "pyzmq>=26.2.1,<28"
      - name: Run the policy against the virtual SO-101 for 20 s
        env:
          POLICY: ${{ inputs.policy || 'samarth-shukla6/act-svla-so101-pickplace' }}
          CAMERAS: ${{ inputs.cameras || 'up,side' }}
        run: |
          nproc; python -c "import torch; print('torch', torch.__version__, 'threads', torch.get_num_threads())"
          python tools/sil/policy_trial.py --out "$RUNNER_TEMP/trial" --policy "$POLICY" --cameras "$CAMERAS" --duration 20
          cat "$RUNNER_TEMP/trial/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-trial
          path: |
            ${{ runner.temp }}/trial/*.log
            ${{ runner.temp }}/trial/*.md
            ${{ runner.temp }}/trial/*.json
            ${{ runner.temp }}/trial/*.png
            ${{ runner.temp }}/trial/command.txt
          if-no-files-found: warn
