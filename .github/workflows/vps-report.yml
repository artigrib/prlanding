# Read-only, short summary of the VPS (OS, disk, memory, Docker, web server). Repo is public: no sensitive details are printed.
# Runs only on pushes to the `backend` branch that touch this file, or by hand (workflow_dispatch).
# Needs repository secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY and optionally VPS_PORT (default 22).
# The key never leaves GitHub; nothing is changed on the server.
name: VPS report
on:
  push:
    branches: [backend]
    paths: ['.github/workflows/vps-report.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency: vps-report
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check secrets are set
        env:
          H: ${{ secrets.VPS_HOST }}
          U: ${{ secrets.VPS_USER }}
          K: ${{ secrets.VPS_SSH_KEY }}
        run: |
          missing=""
          [ -n "$H" ] || missing="$missing VPS_HOST"
          [ -n "$U" ] || missing="$missing VPS_USER"
          [ -n "$K" ] || missing="$missing VPS_SSH_KEY"
          if [ -n "$missing" ]; then echo "::error::Missing secrets:$missing"; exit 1; fi
      - name: Set up SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          # Pinned host key when VPS_KNOWN_HOSTS is set; otherwise trust on first use (see docs/backend.md).
          if [ -n "$KNOWN" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${PORT:-22}" -T 10 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
            echo "::warning::VPS_KNOWN_HOSTS is not set: host key trusted on first use"
          fi
      - name: Collect read-only report
        # The repo is public, so its Actions logs are public: print only a short, low-sensitivity
        # summary as annotations. No port lists, container names, paths or IPs.
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER_: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT }}
        run: |
          set +e
          out=$(ssh -i ~/.ssh/deploy_key -p "${PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$USER_@$HOST" 'bash -s' 2>/dev/null <<'REMOTE'
          . /etc/os-release 2>/dev/null
          echo "os=$PRETTY_NAME"
          echo "cpu=$(nproc)"
          echo "ram=$(free -h | awk '/Mem:/{print $2" total, "$7" available"}')"
          echo "disk=$(df -h / | awk 'NR==2{print $4" free of "$2}')"
          if command -v docker >/dev/null; then echo "docker=yes, $(docker ps -q | wc -l) running containers"; else echo "docker=no"; fi
          for s in nginx caddy apache2 traefik; do command -v $s >/dev/null && w="$w $s"; done; echo "webserver=${w:-none}"
          ss -tln 2>/dev/null | grep -qE ':(80|443) ' && echo "http_ports=80/443 in use" || echo "http_ports=80/443 free"
          for b in node python3 uv; do command -v $b >/dev/null && v="$v $b:$($b --version 2>&1 | head -1 | awk '{print $NF}')"; done; echo "runtimes=${v:-none}"
          REMOTE
          )
          if [ -z "$out" ]; then
            hk=$(grep -c . ~/.ssh/known_hosts 2>/dev/null || echo 0)
            err=$(ssh -i ~/.ssh/deploy_key -p "${PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$USER_@$HOST" true 2>&1 | tail -1)
            case "$err" in
              *"Permission denied"*) why="server reachable, key NOT accepted (not approved yet, or wrong user)";;
              *"timed out"*|*"No route"*|*"refused"*) why="server/port not reachable from GitHub (firewall, wrong host or port)";;
              *"invalid format"*|*"libcrypto"*|*"load key"*) why="VPS_SSH_KEY secret is malformed (paste the whole private key incl. BEGIN/END lines)";;
              *) why="other SSH error";;
            esac
            echo "::error::SSH failed: $why (host key scan lines: $hk)"; exit 1
          fi
          echo "$out" | while IFS= read -r l; do echo "::notice::$l"; done
      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/deploy_key
