name: site-tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate product pages and sitemap (also checks data/components)
        run: node tools/build.mjs
      - name: Purchase plan unit tests (plan totals, variant checker, data schema)
        run: node --test tests/*.test.mjs
      - name: Tree must be unchanged
        run: git diff --exit-code && test -z "$(git status --porcelain)"

  arena:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sim/arena
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sim/arena/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run vendor-three
      - name: Committed build/ and vendor/three/ must be reproducible
        run: git diff --exit-code -- build ../../vendor/three && test -z "$(git status --porcelain -- build ../../vendor/three)"
      - name: Arena unit tests (replay codec)
        run: node --test tests/*.test.mjs

  mujoco-vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: tools/wasm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/wasm/package-lock.json
      - run: npm ci
      - name: Committed sim/so101/vendor/mujoco must equal the stripped npm build
        run: npm run check

  hf-space:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the Hugging Face Spaces
        run: node tools/hf/build-space.mjs
      - name: Every relative import in dist-hf resolves inside its Space
        run: node tools/hf/check-imports.mjs dist-hf

  so101-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run node tests under sim/so101/test*/
        run: |
          shopt -s nullglob globstar
          files=(sim/so101/test*/**/*.test.{mjs,js} sim/so101/test*/**/test*.{mjs,js})
          mapfile -t files < <(printf '%s\n' "${files[@]}" | sort -u | sed '/^$/d')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No so101 unit tests found, skipping."
            exit 0
          fi
          node --test "${files[@]}"

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: ./.github/actions/playwright
      - name: Serve site
        run: |
          python3 -m http.server 8123 >/tmp/http.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8123/ >/dev/null && break; sleep 1; done
      - name: Smoke test
        run: node tests/smoke.mjs
      - name: English smoke test
        run: node tests/smoke-en.mjs
      - name: Hugging Face Space smoke test (dist-hf served at its own root)
        run: node tools/hf/build-space.mjs && node tests/smoke-space.mjs

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: api
            test: npm test
          - pkg: bridge
            test: npm run test:unit
    name: backend-${{ matrix.pkg }}
    defaults:
      run:
        working-directory: backend/${{ matrix.pkg }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/${{ matrix.pkg }}/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: ${{ matrix.test }}

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [so101, arena-replay, bridge, analytics]
    name: e2e-${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/bridge/package-lock.json
      - uses: ./.github/actions/playwright
      - name: so101 sim e2e (software GL; time is advanced through the ?test=1 hooks)
        if: matrix.suite == 'so101'
        run: node sim/so101/tests/e2e.cjs "$RUNNER_TEMP/so101-e2e"
      - name: arena replay e2e
        if: matrix.suite == 'arena-replay'
        run: |
          python3 -m http.server 8792 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8792/ >/dev/null && break; sleep 1; done
          node sim/arena/tests/replay-e2e.cjs http://127.0.0.1:8792
      - name: analytics e2e (consent off/declined/DNT -> zero requests, consent on -> events reach the api, axe on the banner)
        if: matrix.suite == 'analytics'
        run: node tests/analytics-e2e.mjs
      - name: bridge e2e (relay + MCP client + Chromium tab, incl. the real sim)
        if: matrix.suite == 'bridge'
        working-directory: backend/bridge
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure() && matrix.suite == 'so101'
        with:
          name: so101-e2e-screenshots
          path: ${{ runner.temp }}/so101-e2e
          retention-days: 7
