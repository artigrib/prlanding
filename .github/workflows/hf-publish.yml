name: hf-publish
# Publishes the browser sims as static Hugging Face Spaces: <org>/so101-sim and <org>/combat-arena.
# Needs the repository secret HF_TOKEN (fine-grained, write access to the org); without it the run
# ends with a notice and succeeds. Optional repository variable HF_ORG (default: printedrobotics).
# Owner steps: docs/hf.md.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sim/so101/**'
      - 'sim/arena/index.html'
      - 'sim/arena/NOTICE.txt'
      - 'sim/arena/build/**'
      - 'sim/arena/src/robots/catalog.js'
      - 'models/*.glb'
      - 'models/NOTICE.txt'
      - 'assets/i18n.js'
      - 'tools/hf/**'
      - '.github/workflows/hf-publish.yml'

permissions:
  contents: read

concurrency:
  group: hf-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check for HF_TOKEN
        id: token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::notice title=hf-publish::HF_TOKEN not set, skipping the Hugging Face publish (see docs/hf.md)"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.present == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 24

      - name: Build Space folders
        if: steps.token.outputs.present == 'true'
        run: node tools/hf/build-space.mjs

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: steps.token.outputs.present == 'true'
        with:
          python-version: '3.12'

      - name: Install huggingface_hub
        if: steps.token.outputs.present == 'true'
        run: python -m pip install --quiet --disable-pip-version-check "huggingface_hub==2.2.0"

      - name: Upload Spaces
        if: steps.token.outputs.present == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_ORG: ${{ vars.HF_ORG || 'protorobot' }}
        run: python tools/hf/publish_spaces.py
