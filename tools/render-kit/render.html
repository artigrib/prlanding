<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><title>kit render</title>
<style>html,body{margin:0;background:#EEEEEA}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"../../vendor/three/three.module.min.js","three/addons/":"../../vendor/three/addons/"}}</script>
</head><body>
<script type="module">
// Studio render of a kit model for the catalogue (driven by tools/render-kit/render.mjs).
// window.renderKit({ model, show, color, w, h, az, el, dist, ty, passes }) -> resolves when the frame is drawn.
// Catalogue look: the frame is the average of `passes` renders (default 32), each lit by one shadow-casting
// directional light: two thirds near the key direction (behind the model, upper left of the view, jittered),
// the rest from random directions over the sky. The average gives soft gradient floor shadows, contact darkening
// (ambient-occlusion-like) and soft shading. The light sequence is seeded, so a re-render is reproducible.
// passes: 1 = the old single hard-shadow frame.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.VSMShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#EEEEEA');
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.75;
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 14; key.shadow.blurSamples = 24; key.shadow.bias = -0.0004;
scene.add(key, key.target, new THREE.HemisphereLight(0xffffff, 0xdcdcd6, 0.55));
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.16 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const camera = new THREE.PerspectiveCamera(24, 4 / 3, 0.05, 100);
const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
let root = null, url = null;

window.renderKit = async o => {
  if (url !== o.model) {
    if (root) scene.remove(root);
    root = (await loader.loadAsync(o.model)).scene; url = o.model;
    scene.add(root);
  }
  root.traverse(n => {
    if (/^opt_/.test(n.name || '')) n.visible = (o.show || []).includes(n.name);
    if (n.isMesh) {
      n.castShadow = n.receiveShadow = true;
      for (const m of [].concat(n.material)) {
        if (m.name === 'print') { m.color.set(o.color); m.roughness = 0.6; }
        else if (m.metalness > 0.5 && !m.userData.toned) { m.color.multiplyScalar(0.5); m.roughness = 0.55; m.userData.toned = true; }   // steel, not white plastic
      }
    }
  });
  // frame the visible model: floor at y = 0, camera on an azimuth / elevation around its centre
  root.position.set(0, 0, 0); root.updateMatrixWorld(true);
  const box = new THREE.Box3();
  root.traverseVisible(n => { if (n.isMesh) box.expandByObject(n); });
  root.position.y = -box.min.y; root.updateMatrixWorld(true);
  box.translate(new THREE.Vector3(0, -box.min.y, 0));
  const c = box.getCenter(new THREE.Vector3()), r = box.getSize(new THREE.Vector3()).length() / 2;
  c.y = (box.max.y - box.min.y) * (o.ty ?? 0.35);   // look-at height (fraction of the model height)
  const az = THREE.MathUtils.degToRad(o.az ?? 35), el = THREE.MathUtils.degToRad(o.el ?? 26), d = r * (o.dist ?? 4.2);
  camera.position.set(c.x + d * Math.cos(el) * Math.sin(az), c.y + d * Math.sin(el), c.z + d * Math.cos(el) * Math.cos(az));
  camera.lookAt(c);
  renderer.setPixelRatio(1); renderer.setSize(o.w, o.h, false);
  camera.aspect = o.w / o.h; camera.updateProjectionMatrix();
  const passes = Math.max(1, o.passes ?? 32);
  // key light from the upper left of the view, slightly behind the model: the soft shadow falls to the right
  const fwd = camera.position.clone().sub(c).setY(0).normalize(), right = new THREE.Vector3(fwd.z, 0, -fwd.x);
  const KEY = passes === 1 ? new THREE.Vector3(-3, 7, 4).normalize() : right.clone().multiplyScalar(-0.9).addScaledVector(fwd, -0.25).add(new THREE.Vector3(0, 1.2, 0)).normalize();
  let seed = 0x5eed;
  const rnd = () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const s = r * 5; Object.assign(key.shadow.camera, { left: -s, right: s, top: s, bottom: -s, near: 0.1, far: r * 20 });
  key.shadow.camera.updateProjectionMatrix();
  key.shadow.normalBias = r * 0.004;
  ground.material.opacity = passes === 1 ? 0.16 : 0.7;
  const gl = renderer.getContext(), w = o.w, h = o.h;
  const sum = passes > 1 ? new Uint32Array(w * h * 4) : null, px = passes > 1 ? new Uint8Array(w * h * 4) : null;
  for (let i = 0; i < passes; i++) {
    const dir = KEY.clone();
    if (passes > 1) {
      if (i % 3 === 2) {   // sky: random direction at least 65 deg above the horizon (contact darkening)
        const a = rnd() * Math.PI * 2, y = Math.sin(THREE.MathUtils.degToRad(65)) + rnd() * (1 - Math.sin(THREE.MathUtils.degToRad(65)));
        const q = Math.sqrt(1 - y * y); dir.set(q * Math.cos(a), y, q * Math.sin(a));
      } else {         // key: jittered over a wide cone (large, soft penumbra)
        dir.add(new THREE.Vector3(rnd() - 0.5, rnd() - 0.5, rnd() - 0.5).multiplyScalar(1.0)).normalize();
      }
    }
    key.position.copy(c).addScaledVector(dir, r * 8); key.target.position.copy(c);
    renderer.render(scene, camera);
    if (!sum) break;
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
    for (let k = 0; k < px.length; k++) sum[k] += px[k];
  }
  let src = renderer.domElement;
  if (sum) {   // average, flipped (readPixels starts at the bottom row)
    src = document.createElement('canvas'); src.width = w; src.height = h;
    const sg = src.getContext('2d'), img = sg.createImageData(w, h), d8 = img.data, row = w * 4;
    for (let y = 0; y < h; y++) {
      const a = (h - 1 - y) * row, b = y * row;
      for (let k = 0; k < row; k++) d8[b + k] = Math.round(sum[a + k] / passes);
    }
    sg.putImageData(img, 0, 0);
  }
  if (!o.jpeg) return true;
  // supersampled frame -> downscaled JPEG (the catalogue size)
  const out = document.createElement('canvas'); out.width = o.jpeg.w; out.height = o.jpeg.h;
  const g = out.getContext('2d'); g.imageSmoothingQuality = 'high';
  g.drawImage(src, 0, 0, o.jpeg.w, o.jpeg.h);
  return out.toDataURL('image/jpeg', o.jpeg.q || 0.86);
};
window.ready = true;
</script>
